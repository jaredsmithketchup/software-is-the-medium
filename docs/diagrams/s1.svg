<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 156" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <rect x="8" y="4" width="88" height="26" rx="13" fill="#075985"/>
  <text x="52" y="22" font-size="12" font-weight="700" fill="#BAE6FD" text-anchor="middle">DATA</text>
  <rect x="104" y="4" width="88" height="26" rx="13" fill="#312E81"/>
  <text x="148" y="22" font-size="12" font-weight="700" fill="#C7D2FE" text-anchor="middle">CODE</text>
  <text x="844" y="22" font-size="12" font-weight="600" fill="#9CA3AF" text-anchor="end">every program is these two, on five parts</text>

  <g font-weight="700" text-anchor="middle">
    <g>
      <rect x="8" y="42" width="156" height="64" rx="10" fill="#1F2937" stroke="#6366F1" stroke-width="2"/>
      <text x="86" y="68" font-size="15" fill="#F9FAFB">STATE</text>
      <text x="86" y="88" font-size="11" font-weight="400" fill="#94A3B8">what is remembered</text>
    </g>
    <g>
      <rect x="176" y="42" width="156" height="64" rx="10" fill="#1F2937" stroke="#818CF8" stroke-width="2"/>
      <text x="254" y="68" font-size="15" fill="#F9FAFB">LOGIC</text>
      <text x="254" y="88" font-size="11" font-weight="400" fill="#94A3B8">what changes it</text>
    </g>
    <g>
      <rect x="344" y="42" width="156" height="64" rx="10" fill="#1F2937" stroke="#38BDF8" stroke-width="2"/>
      <text x="422" y="68" font-size="15" fill="#F9FAFB">INPUT</text>
      <text x="422" y="88" font-size="11" font-weight="400" fill="#94A3B8">what gets in</text>
    </g>
    <g>
      <rect x="512" y="42" width="156" height="64" rx="10" fill="#1F2937" stroke="#34D399" stroke-width="2"/>
      <text x="590" y="68" font-size="15" fill="#F9FAFB">OUTPUT</text>
      <text x="590" y="88" font-size="11" font-weight="400" fill="#94A3B8">what comes out</text>
    </g>
    <g>
      <rect x="680" y="42" width="172" height="64" rx="10" fill="#1F2937" stroke="#A78BFA" stroke-width="2"/>
      <text x="766" y="68" font-size="15" fill="#F9FAFB">CLOCK</text>
      <text x="766" y="88" font-size="11" font-weight="400" fill="#94A3B8">who decides when</text>
    </g>
  </g>

  <g font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="8" y="122" width="190" height="24" rx="6" fill="#4F46E5"/>
    <text x="103" y="138">1 · FOUNDATIONS</text>
    <rect x="206" y="122" width="230" height="24" rx="6" fill="#0284C7"/>
    <text x="321" y="138">2 · WORLD & MACHINE</text>
    <rect x="444" y="122" width="210" height="24" rx="6" fill="#059669"/>
    <text x="549" y="138">3 · PEOPLE</text>
    <rect x="662" y="122" width="190" height="24" rx="6" fill="#6D28D9"/>
    <text x="757" y="138">4 · WHAT'S NEXT</text>
  </g>
</svg>
