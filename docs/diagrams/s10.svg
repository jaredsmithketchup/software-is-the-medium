<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 100" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <g font-weight="700" text-anchor="middle">
    <rect x="8" y="8" width="156" height="84" rx="10" fill="#1F2937" stroke="#6366F1" stroke-width="2"/>
    <text x="86" y="42" font-size="15" fill="#F9FAFB">STATE</text>
    <text x="86" y="64" font-size="11" font-weight="400" fill="#94A3B8">what is stored</text>
    <rect x="176" y="8" width="156" height="84" rx="10" fill="#1F2937" stroke="#818CF8" stroke-width="2"/>
    <text x="254" y="42" font-size="15" fill="#F9FAFB">LOGIC</text>
    <text x="254" y="64" font-size="11" font-weight="400" fill="#94A3B8">code over data</text>
    <rect x="344" y="8" width="156" height="84" rx="10" fill="#1F2937" stroke="#38BDF8" stroke-width="2"/>
    <text x="422" y="42" font-size="15" fill="#F9FAFB">INPUT</text>
