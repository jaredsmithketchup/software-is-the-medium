  <title id="s10-title">Five responsibilities connected</title><desc id="s10-desc">Input triggers logic. Logic reads and writes state. Output presents state. A clock schedules the work.</desc>
  <defs><marker id="s10-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#94A3B8"/></marker></defs>
