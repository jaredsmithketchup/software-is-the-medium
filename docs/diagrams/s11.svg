  <g fill="#1F2937" stroke-width="2"><rect x="5" y="65" width="180" height="95" rx="10" stroke="#38BDF8"/><rect x="240" y="65" width="180" height="95" rx="10" stroke="#818CF8"/><rect x="480" y="65" width="180" height="95" rx="10" stroke="#6EE7B7"/><rect x="715" y="65" width="180" height="95" rx="10" stroke="#38BDF8"/><rect x="300" y="202" width="300" height="42" rx="10" stroke="#C084FC"/></g>
  <g text-anchor="middle" fill="#F9FAFB" font-size="24" font-weight="700"><text x="95" y="99">INPUT</text><text x="330" y="99">LOGIC</text><text x="570" y="99">STATE</text><text x="805" y="99">OUTPUT</text><text x="450" y="231" font-size="21">CLOCK: when it runs</text></g>
  <g text-anchor="middle" fill="#CBD5E1" font-size="20"><text x="95" y="133">Fire request</text><text x="330" y="133">Check + update</text><text x="570" y="133">Ammo: 30 → 29</text><text x="805" y="133">Flash + sound</text><text x="450" y="37">Rules read facts before changing them</text></g>
