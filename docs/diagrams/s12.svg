<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="s12-title s12-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s12-title">A schema describes the data</title><desc id="s12-desc">A producer writes a record whose fields and types are declared by a schema; consumers and tools check the record against it, so validity is not an opinion.</desc>
  <defs><marker id="s12-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9CA3AF"/></marker></defs>
  <rect x="20" y="90" width="150" height="64" rx="10" fill="#075985"/>
  <text x="95" y="120" font-size="13" font-weight="700" fill="#BAE6FD" text-anchor="middle">PRODUCER</text>
  <text x="95" y="140" font-size="10" fill="#E0F2FE" text-anchor="middle">writes a record</text>
  <rect x="260" y="30" width="240" height="180" rx="12" fill="#1F2937" stroke="#6366F1"/>
  <text x="380" y="58" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="middle">A SCHEMA DECLARES</text>
  <g font-size="12.5" fill="#CBD5E1">
    <text x="285" y="88">name</text><text x="345" y="88" fill="#818CF8">: string</text>
    <text x="285" y="118">rounds</text><text x="345" y="118" fill="#818CF8">: integer 0–30</text>
    <text x="285" y="148">cooldown</text><text x="345" y="148" fill="#818CF8">: seconds</text>
    <text x="285" y="178">units</text><text x="345" y="178" fill="#818CF8">: meters</text>
  </g>
  <text x="380" y="200" font-size="11" fill="#6EE7B7" text-anchor="middle">every read checks these fields</text>
  <rect x="590" y="90" width="150" height="64" rx="10" fill="#0C4A6E"/>
  <text x="665" y="120" font-size="13" font-weight="700" fill="#BAE6FD" text-anchor="middle">CONSUMER</text>
  <text x="665" y="140" font-size="10" fill="#E0F2FE" text-anchor="middle">reads the record</text>
  <g fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#s12-arrow)"><path d="M170 122 H258"/><path d="M500 122 H588"/></g>
</svg>