<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 168" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <rect x="16" y="10" width="112" height="48" rx="10" fill="#075985"/>
  <text x="72" y="39" font-size="13" font-weight="700" fill="#BAE6FD" text-anchor="middle">IN</text>

  <line x1="132" y1="34" x2="150" y2="34" stroke="#9CA3AF" stroke-width="2"/>
  <polygon points="150,28 162,34 150,40" fill="#9CA3AF"/>

  <rect x="174" y="10" width="112" height="48" rx="10" fill="#312E81"/>
  <text x="230" y="39" font-size="13" font-weight="700" fill="#C7D2FE" text-anchor="middle">MIDDLE</text>

  <line x1="290" y1="34" x2="308" y2="34" stroke="#9CA3AF" stroke-width="2"/>
  <polygon points="308,28 320,34 308,40" fill="#9CA3AF"/>

  <rect x="332" y="10" width="112" height="48" rx="10" fill="#064E3B"/>
  <text x="388" y="39" font-size="13" font-weight="700" fill="#D1FAE5" text-anchor="middle">OUT</text>

  <path d="M388 58 V92 H72 V66" fill="none" stroke="#34D399" stroke-width="2"/>
  <polygon points="66,66 78,66 72,54" fill="#34D399"/>

  <rect x="118" y="76" width="224" height="36" rx="10" fill="#064E3B" stroke="#34D399"/>
  <text x="230" y="98" font-size="12" font-weight="700" fill="#D1FAE5" text-anchor="middle">you see it, decide, act</text>

  <text x="230" y="140" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">the picture comes back as the next input</text>
  <text x="230" y="158" font-size="11" fill="#6B7280" text-anchor="middle">that is the loop</text>
</svg>
