<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <g font-size="12" font-weight="700" fill="#E5E7EB" text-anchor="middle">
    <rect x="8" y="28" width="160" height="100" rx="10" fill="#1F2937" stroke="#6366F1"/>
    <text x="88" y="52" fill="#A5B4FC">SCENE GRAPH</text>
    <text x="88" y="76" font-size="11" font-weight="400">parent / child</text>
    <text x="88" y="96" font-size="11" font-weight="400">transforms</text>
    <rect x="180" y="28" width="160" height="100" rx="10" fill="#1F2937" stroke="#38BDF8"/>
    <text x="260" y="52" fill="#7DD3FC">BSP + ENTITIES</text>
    <text x="260" y="76" font-size="11" font-weight="400">compiled rooms</text>
    <text x="260" y="96" font-size="11" font-weight="400">flat entity list</text>
    <rect x="352" y="28" width="160" height="100" rx="10" fill="#1F2937" stroke="#34D399"/>
    <text x="432" y="52" fill="#6EE7B7">ECS</text>
    <text x="432" y="76" font-size="11" font-weight="400">columns of data</text>
    <text x="432" y="96" font-size="11" font-weight="400">systems scan them</text>
  </g>
  <text x="260" y="18" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">STATE — three ways to store a world</text>
</svg>
