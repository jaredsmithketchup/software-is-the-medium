<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="s14-title s14-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s14-title">The world is not its picture</title><desc id="s14-desc">Authoritative world state with target health 75 feeds a render representation, a HUD display and sound events. A headless server can own facts without displaying them.</desc>
  <defs><marker id="s14-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7DD3FC"/></marker></defs>
  <g stroke="#7DD3FC" stroke-width="2" fill="none" marker-end="url(#s14-arrow)"><path d="M370 107 H440 V40 H540"/><path d="M440 107 H540"/><path d="M440 107 V177 H540"/></g>
  <rect x="20" y="47" width="350" height="122" rx="12" fill="#1F2937" stroke="#6EE7B7" stroke-width="2"/>
  <g fill="#1F2937" stroke="#7DD3FC"><rect x="540" y="15" width="340" height="50" rx="8"/><rect x="540" y="82" width="340" height="50" rx="8"/><rect x="540" y="152" width="340" height="50" rx="8"/></g>
  <g text-anchor="middle" font-size="23" fill="#F9FAFB"><text x="195" y="84">AUTHORITATIVE WORLD</text><text x="195" y="120">Target health: 75</text><text x="710" y="48">Renderer: visible reaction</text><text x="710" y="115">HUD: health bar</text><text x="710" y="185">Audio: impact sound</text></g>
  <text x="195" y="148" text-anchor="middle" font-size="18" fill="#6EE7B7">Can exist without a screen</text><text x="450" y="229" text-anchor="middle" font-size="20" fill="#CBD5E1">Check the facts and the presentation separately</text>
</svg>
