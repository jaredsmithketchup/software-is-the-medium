<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 96" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <g font-weight="700" text-anchor="middle">
    <g>
      <rect x="8" y="8" width="156" height="80" rx="10" fill="#1F2937" stroke="#6366F1" stroke-width="2"/>
      <text x="86" y="40" font-size="15" fill="#F9FAFB">STATE</text>
      <text x="86" y="62" font-size="11" font-weight="400" fill="#94A3B8">what is remembered</text>
    </g>
    <g>
      <rect x="176" y="8" width="156" height="80" rx="10" fill="#1F2937" stroke="#818CF8" stroke-width="2"/>
      <text x="254" y="40" font-size="15" fill="#F9FAFB">LOGIC</text>
      <text x="254" y="62" font-size="11" font-weight="400" fill="#94A3B8">what changes it</text>
    </g>
    <g>
      <rect x="344" y="8" width="156" height="80" rx="10" fill="#1F2937" stroke="#38BDF8" stroke-width="2"/>
      <text x="422" y="40" font-size="15" fill="#F9FAFB">INPUT</text>
      <text x="422" y="62" font-size="11" font-weight="400" fill="#94A3B8">what gets in</text>
    </g>
    <g>
      <rect x="512" y="8" width="156" height="80" rx="10" fill="#1F2937" stroke="#34D399" stroke-width="2"/>
      <text x="590" y="40" font-size="15" fill="#F9FAFB">OUTPUT</text>
      <text x="590" y="62" font-size="11" font-weight="400" fill="#94A3B8">what comes out</text>
    </g>
    <g>
      <rect x="680" y="8" width="172" height="80" rx="10" fill="#1F2937" stroke="#A78BFA" stroke-width="2"/>
      <text x="766" y="40" font-size="15" fill="#F9FAFB">CLOCK</text>
      <text x="766" y="62" font-size="11" font-weight="400" fill="#94A3B8">who decides when</text>
    </g>
  </g>
</svg>
