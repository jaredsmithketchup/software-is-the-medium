<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="s22-title s22-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s22-title">Fire request with validation and branching</title><desc id="s22-desc">A fire request checks ammunition and cooldown. Rejection leaves state unchanged. Acceptance spends ammunition and emits a shot event. Only a valid hit changes target health.</desc>
  <defs><marker id="s22-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6EE7B7"/></marker></defs>
  <g fill="none" stroke="#6EE7B7" stroke-width="2" marker-end="url(#s22-arrow)"><path d="M130 76 H190"/><path d="M440 76 H500"/><path d="M690 76 H730"/><path d="M315 124 V166"/><path d="M595 124 V166"/></g>
  <g fill="#1F2937" stroke="#6EE7B7"><rect x="5" y="30" width="125" height="94" rx="10"/><rect x="190" y="30" width="250" height="94" rx="10"/><rect x="500" y="30" width="190" height="94" rx="10"/><rect x="730" y="30" width="165" height="94" rx="10"/><rect x="190" y="166" width="250" height="65" rx="10" stroke="#FCA5A5"/><rect x="500" y="166" width="395" height="65" rx="10"/></g>
  <g text-anchor="middle" font-size="22" fill="#F9FAFB"><text x="68" y="71">FIRE</text><text x="315" y="66">Ammo &gt; 0?</text><text x="315" y="98">Cooldown ready?</text><text x="595" y="66">Ammo: 30 → 29</text><text x="595" y="98">Start cooldown</text><text x="812" y="83">Shot event</text><text x="315" y="193" fill="#FCA5A5">No: reject request</text><text x="697" y="193">Valid hit? Health: 100 → 75</text></g>
  <g text-anchor="middle" font-size="18" fill="#CBD5E1"><text x="68" y="100">request</text><text x="470" y="58">yes</text><text x="315" y="218">No ammo or health change</text><text x="697" y="219">Miss: no health change</text></g>
</svg>
