<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 148" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <g font-size="12" font-weight="700" fill="#F9FAFB" text-anchor="middle">
    <rect x="8" y="8" width="148" height="34" rx="8" fill="#1F2937" stroke="#38BDF8"/>
    <text x="82" y="30">1 device</text>
    <polygon points="160,25 172,19 172,31" fill="#94A3B8"/>
    <rect x="180" y="8" width="148" height="34" rx="8" fill="#1F2937" stroke="#38BDF8"/>
    <text x="254" y="30">2 commands</text>
    <polygon points="332,25 344,19 344,31" fill="#94A3B8"/>
    <rect x="352" y="8" width="148" height="34" rx="8" fill="#1F2937" stroke="#6366F1"/>
    <text x="426" y="30">3 update</text>
    <polygon points="504,25 516,19 516,31" fill="#94A3B8"/>
    <rect x="524" y="8" width="148" height="34" rx="8" fill="#1F2937" stroke="#6366F1"/>
    <text x="598" y="30">4 world</text>

    <rect x="8" y="62" width="148" height="34" rx="8" fill="#1F2937" stroke="#34D399"/>
    <text x="82" y="84">5 render</text>
    <polygon points="160,79 172,73 172,85" fill="#94A3B8"/>
    <rect x="180" y="62" width="148" height="34" rx="8" fill="#1F2937" stroke="#34D399"/>
    <text x="254" y="84">6 screen</text>
    <polygon points="332,79 344,73 344,85" fill="#94A3B8"/>
    <rect x="352" y="62" width="148" height="34" rx="8" fill="#1F2937" stroke="#34D399"/>
    <text x="426" y="84">7 you see it</text>
    <polygon points="504,79 516,73 516,85" fill="#94A3B8"/>
    <rect x="524" y="62" width="148" height="34" rx="8" fill="#1F2937" stroke="#34D399"/>
    <text x="598" y="84">8 you act</text>
  </g>
  <text x="340" y="122" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="middle">then it repeats. The frame is one beat.</text>
  <text x="340" y="140" font-size="11" fill="#94A3B8" text-anchor="middle">60 to 144 times a second</text>
</svg>
