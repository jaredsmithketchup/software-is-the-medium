<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="s29-title s29-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s29-title">Where each weapon element lives</title><desc id="s29-desc">Values, assets, and content live in data; decisions live in code. The schema is the seam between the sides.</desc>
  <rect x="20" y="40" width="330" height="170" rx="12" fill="#1F2937" stroke="#6EE7B7"/>
  <text x="185" y="70" font-size="14" font-weight="700" fill="#D1FAE5" text-anchor="middle">DATA — VALUES</text>
  <g font-size="12.5" fill="#CBD5E1">
    <text x="45" y="100">damage 25 · cooldown 0.2 s</text>
    <text x="45" y="126">magazine 30 · valid ranges</text>
    <text x="45" y="152">mesh · sounds · UI strings</text>
    <text x="45" y="178">edited by designers</text>
  </g>
  <rect x="410" y="40" width="330" height="170" rx="12" fill="#1F2937" stroke="#6EE7B7"/>
  <text x="575" y="70" font-size="14" font-weight="700" fill="#6EE7B7" text-anchor="middle">CODE — DECISIONS</text>
  <g font-size="12.5" fill="#CBD5E1">
    <text x="435" y="100">may fire? eligibility</text>
    <text x="435" y="126">hit test · damage applied</text>
    <text x="435" y="152">spend the round · cooldown</text>
    <text x="435" y="178">run by engine logic</text>
  </g>
  <g fill="none" stroke="#6EE7B7" stroke-width="2">
    <path d="M352 100 H408" marker-end="url(#s29-a)"/><path d="M408 120 H352" marker-end="url(#s29-a)"/>
  </g>
  <defs><marker id="s29-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6EE7B7"/></marker></defs>
  <rect x="330" y="214" width="100" height="30" rx="15" fill="#111827" stroke="#6366F1"/>
  <text x="380" y="233" font-size="11.5" fill="#A5B4FC" text-anchor="middle">the schema, the contract</text>
</svg>