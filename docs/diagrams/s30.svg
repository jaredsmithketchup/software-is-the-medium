<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="s30-title s30-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s30-title">A DOOM 3 weapon from data to code</title><desc id="s30-desc">Config files and assets live on the data side, bindings attach them by name, and scripts plus C++ run the weapon's behavior.</desc>
  <defs><marker id="s30-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6EE7B7"/></marker></defs>
  <rect x="20" y="40" width="240" height="170" rx="12" fill="#1F2937" stroke="#6EE7B7"/>
  <text x="140" y="70" font-size="14" font-weight="700" fill="#D1FAE5" text-anchor="middle">DATA — FILES</text>
  <g font-size="12.5" fill="#CBD5E1">
    <text x="45" y="102">.decl config: ammo, damage,</text>
    <text x="45" y="124">fire interval, names</text>
    <text x="45" y="152">.mdl model · .mtr materials</text>
    <text x="45" y="178">.sndshd · .gui</text>
  </g>
  <rect x="300" y="40" width="160" height="170" rx="12" fill="#111827" stroke="#6366F1"/>
  <text x="380" y="70" font-size="14" font-weight="700" fill="#A5B4FC" text-anchor="middle">BINDING</text>
  <g font-size="12.5" fill="#CBD5E1">
    <text x="325" y="102">names link config</text>
    <text x="325" y="124">to assets and</text>
    <text x="325" y="146">script variables</text>
  </g>
  <rect x="500" y="40" width="240" height="170" rx="12" fill="#1F2937" stroke="#6EE7B7"/>
  <text x="620" y="70" font-size="14" font-weight="700" fill="#6EE7B7" text-anchor="middle">CODE — BEHAVIOR</text>
  <g font-size="12.5" fill="#CBD5E1">
    <text x="525" y="102">idScript runs the fire sequence</text>
    <text x="525" y="124">reads and mutates entity state</text>
    <text x="525" y="152">C++ idWeapon entity</text>
    <text x="525" y="178">engine-side behavior</text>
  </g>
  <g fill="none" stroke="#6EE7B7" stroke-width="2" marker-end="url(#s30-arrow)"><path d="M260 125 H298"/><path d="M460 125 H498"/></g>
  <text x="279" y="112" font-size="10.5" fill="#6EE7B7" text-anchor="middle">by name</text>
  <text x="479" y="112" font-size="10.5" fill="#6EE7B7" text-anchor="middle">then runs</text>
</svg>