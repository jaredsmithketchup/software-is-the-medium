  <line x1="20" y1="196" x2="450" y2="196" stroke="#374151" stroke-width="1"/>
  <text x="240" y="220" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">three answers to: what is the world, and who owns it?</text>
