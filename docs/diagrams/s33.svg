<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="s30-title s30-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s30-title">A bounded AI change with acceptance checks</title><desc id="s30-desc">Inspect the current path, make a small diff, run tests, then review evidence. Test empty ammunition, active cooldown, a valid hit, and a valid miss.</desc>
  <path d="M100 70 H790" stroke="#D8B4FE" stroke-width="3"/>
  <g fill="#3B0764" stroke="#C084FC" stroke-width="2"><circle cx="110" cy="70" r="36"/><circle cx="335" cy="70" r="36"/><circle cx="560" cy="70" r="36"/><circle cx="785" cy="70" r="36"/></g>
  <g text-anchor="middle" fill="#F9FAFB" font-size="28"><text x="110" y="80">1</text><text x="335" y="80">2</text><text x="560" y="80">3</text><text x="785" y="80">4</text></g>
  <g text-anchor="middle" fill="#D8B4FE" font-size="23"><text x="110" y="138">Inspect</text><text x="335" y="138">Small diff</text><text x="560" y="138">Run tests</text><text x="785" y="138">Review evidence</text></g>
  <text x="450" y="185" text-anchor="middle" font-size="22" fill="#CBD5E1">Empty ammo · cooldown active · hit · miss</text>
</svg>
