<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="s28-title s28-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s28-title">Neural upscaling is an output component</title><desc id="s28-desc">A low resolution frame with motion, depth and history feeds a neural reconstruction stage that produces a higher resolution image. Authoritative health and collision remain separate responsibilities.</desc>
  <defs><marker id="s28-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#D8B4FE"/></marker></defs>
  <path d="M255 91 H325 M585 91 H645" stroke="#D8B4FE" stroke-width="2" marker-end="url(#s28-arrow)"/>
  <g fill="#1F2937" stroke="#C084FC" stroke-width="2"><rect x="5" y="30" width="250" height="120" rx="10"/><rect x="325" y="30" width="260" height="120" rx="10"/><rect x="645" y="30" width="250" height="120" rx="10"/></g>
  <g text-anchor="middle" fill="#F9FAFB" font-size="23"><text x="130" y="76">Low-resolution frame</text><text x="455" y="76">Neural reconstruction</text><text x="770" y="76">Higher-resolution</text><text x="770" y="108">image</text></g>
  <g text-anchor="middle" fill="#CBD5E1" font-size="19"><text x="130" y="108">+ motion, depth, history</text><text x="455" y="108">Example: DLSS SR</text></g>
  <text x="450" y="192" text-anchor="middle" fill="#D8B4FE" font-size="23">An image-quality technique, not a new source of gameplay truth</text>
</svg>
