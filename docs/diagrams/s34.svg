<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" role="img" aria-labelledby="s29-title s29-desc" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <title id="s29-title">Tool-enabled AI with a permission boundary</title><desc id="s29-desc">A user supplies a goal. A model proposes tool calls. A harness checks permissions and invokes tools. Results return as evidence. Human review checks the diff and tests. Execution can be local or remote.</desc>
  <defs><marker id="s29-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#D8B4FE"/></marker></defs>
  <g fill="none" stroke="#D8B4FE" stroke-width="2" marker-end="url(#s29-arrow)"><path d="M140 97 H190"/><path d="M380 97 H430"/><path d="M645 97 H695"/><path d="M790 146 V194 H285 V150"/></g>
  <g fill="#1F2937" stroke="#C084FC"><rect x="5" y="49" width="135" height="97" rx="10"/><rect x="190" y="49" width="190" height="97" rx="10"/><rect x="430" y="49" width="215" height="97" rx="10"/><rect x="695" y="49" width="200" height="97" rx="10"/></g>
  <g text-anchor="middle" fill="#F9FAFB" font-size="24"><text x="72" y="86">YOU</text><text x="285" y="86">MODEL</text><text x="537" y="86">HARNESS</text><text x="795" y="86">TOOLS</text></g>
  <g text-anchor="middle" fill="#CBD5E1" font-size="19"><text x="72" y="118">goal + limits</text><text x="285" y="118">proposes an action</text><text x="537" y="118">permissions + calls</text><text x="795" y="118">read / edit / test</text><text x="545" y="224">Results feed the next step; you review the evidence</text><text x="450" y="24">Local or remote: check where data and execution go</text></g>
</svg>
