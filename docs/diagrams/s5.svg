<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <rect x="12" y="10" width="200" height="206" rx="14" fill="#312E81"/>
  <text x="112" y="48" font-size="24" font-weight="800" fill="#A5B4FC" text-anchor="middle">CODE</text>
  <text x="112" y="78" font-size="11" fill="#9CA3AF" text-anchor="middle">the active rules</text>
  <g font-size="13" fill="#E5E7EB">
    <circle cx="42" cy="112" r="4" fill="#6366F1"/><text x="58" y="116">procedures, functions</text>
    <circle cx="42" cy="142" r="4" fill="#6366F1"/><text x="58" y="146">"do this, then that"</text>
    <circle cx="42" cy="172" r="4" fill="#6366F1"/><text x="58" y="176">the behavior</text>
  </g>

  <rect x="228" y="10" width="200" height="206" rx="14" fill="#0C4A6E"/>
  <text x="328" y="48" font-size="24" font-weight="800" fill="#7DD3FC" text-anchor="middle">DATA</text>
  <text x="328" y="78" font-size="11" fill="#9CA3AF" text-anchor="middle">the passive values</text>
  <g font-size="13" fill="#E5E7EB">
    <circle cx="258" cy="112" r="4" fill="#38BDF8"/><text x="274" y="116">numbers, text, state</text>
    <circle cx="258" cy="142" r="4" fill="#38BDF8"/><text x="274" y="146">read and written</text>
    <circle cx="258" cy="172" r="4" fill="#38BDF8"/><text x="274" y="176">the values acted on</text>
  </g>

  <rect x="12" y="246" width="416" height="58" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="220" y="274" font-size="17" font-weight="700" fill="#F9FAFB" text-anchor="middle">No third substance</text>
  <text x="220" y="294" font-size="11" fill="#9CA3AF" text-anchor="middle">the line between them is chosen, not given</text>
</svg>
