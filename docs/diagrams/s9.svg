<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" font-family="Montserrat, Lato, Segoe UI, sans-serif">
  <rect x="8" y="26" width="120" height="78" rx="12" fill="#075985"/>
  <text x="68" y="52" font-size="13" font-weight="700" fill="#BAE6FD" text-anchor="middle">INPUT</text>
  <text x="68" y="84" font-size="11" fill="#E0F2FE" text-anchor="middle">keys · files · packets</text>

  <line x1="132" y1="65" x2="152" y2="65" stroke="#9CA3AF" stroke-width="2"/>
  <polygon points="152,53 166,65 152,77" fill="#9CA3AF"/>

  <rect x="160" y="26" width="120" height="78" rx="12" fill="#312E81"/>
  <text x="220" y="52" font-size="13" font-weight="700" fill="#C7D2FE" text-anchor="middle">PROCESS</text>
  <text x="220" y="84" font-size="11" fill="#E0E7FF" text-anchor="middle">code over data</text>

  <line x1="284" y1="65" x2="304" y2="65" stroke="#9CA3AF" stroke-width="2"/>
  <polygon points="304,53 318,65 304,77" fill="#9CA3AF"/>

  <rect x="312" y="26" width="120" height="78" rx="12" fill="#064E3B"/>
  <text x="372" y="52" font-size="13" font-weight="700" fill="#D1FAE5" text-anchor="middle">OUTPUT</text>
  <text x="372" y="84" font-size="11" fill="#A7F3D0" text-anchor="middle">pixels · sound · writes</text>

  <text x="220" y="150" font-size="13" fill="#94A3B8" text-anchor="middle" font-weight="600">scale · speed · where the boundaries are drawn</text>
  <line x1="60" y1="176" x2="380" y2="176" stroke="#374151" stroke-width="1"/>
  <text x="220" y="196" font-size="11" fill="#6B7280" text-anchor="middle">a game, a browser, a calculator — the same three boxes</text>
</svg>
